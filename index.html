<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14203B" />
<title>Sintoniza - entrena tu oido</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap');
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
 --ink:#14203B; --ink2:#3c496d; --teal:#0FA3A3; --teal-d:#0a7d7d; --amber:#F5A524; --amber-d:#F0873E;
 --coral:#EF5D48; --muted:#64708C; --line:#dfe3ee; --card:#FFFFFF;
 --g-primary:linear-gradient(135deg,#1d2b52 0%,#0FA3A3 130%);
 --g-signal:linear-gradient(135deg,#F5A524 0%,#F0873E 100%);
 --g-wave:linear-gradient(90deg,#0FA3A3,#F5A524);
}
html,body{ height:100%; }
body{ font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
 background:
  radial-gradient(720px 380px at 82% -6%, rgba(245,165,36,.16), transparent 60%),
  radial-gradient(760px 460px at 8% 2%, rgba(15,163,163,.16), transparent 62%),
  linear-gradient(178deg,#EEF3F5 0%,#E9ECF4 52%,#E6E9F2 100%);
 background-attachment:fixed; min-height:100vh; }
.wrap{ max-width:540px; margin:0 auto; padding:18px 18px 44px; }
.disp{ font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.02em; }

/* header + onda firma */
.hero{ position:relative; margin-bottom:14px; }
.wavebar{ position:absolute; inset:0; overflow:hidden; border-radius:22px; opacity:.9; pointer-events:none; z-index:0; }
.wavebar svg{ position:absolute; bottom:-6px; left:0; width:200%; height:100%; animation:drift 14s linear infinite; }
@keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.herocard{ position:relative; z-index:1; background:var(--g-primary); border-radius:22px; padding:20px 20px 22px;
 box-shadow:0 18px 40px -20px rgba(20,32,59,.6); overflow:hidden; }
.herocard .wavebar svg path{ fill:none; stroke-width:2; }
.brandrow{ display:flex; align-items:center; gap:11px; position:relative; z-index:2; }
.logo{ width:42px;height:42px;border-radius:13px;flex:none; background:rgba(255,255,255,.14); backdrop-filter:blur(4px);
 display:grid;place-items:center; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); }
.brandname{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; color:#fff; line-height:1; letter-spacing:-.02em; }
.brandtag{ color:rgba(255,255,255,.82); font-size:12.5px; margin-top:5px; position:relative; z-index:2; max-width:360px; line-height:1.4; }
.hrow{ display:flex; gap:8px; align-items:center; margin-top:14px; position:relative; z-index:2; flex-wrap:wrap; }
.test{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
 color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:.18s; }
.test:hover{ background:rgba(255,255,255,.26); } .test:active{ transform:translateY(1px); }
.streak{ display:inline-flex; align-items:center; gap:6px; background:rgba(245,165,36,.22); border:1px solid rgba(245,165,36,.4);
 color:#ffe6bd; border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; }

/* controles superiores */
.levels{ display:flex; gap:8px; margin:16px 0 14px; }
.lvl{ flex:1; border:1.5px solid var(--line); background:rgba(255,255,255,.7); border-radius:13px; padding:10px 0;
 font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; transition:.18s; backdrop-filter:blur(4px); }
.lvl.on{ border-color:transparent; background:var(--g-primary); color:#fff; box-shadow:0 8px 18px -10px rgba(20,32,59,.5); }
.tlabel{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:2px 3px 9px; }
.rowscroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:7px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.rowscroll::-webkit-scrollbar{ display:none; }
.topics{ margin-bottom:16px; }
.chip{ flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.72); color:var(--ink2); border-radius:999px;
 padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; transition:.18s; }
.chip.on{ border-color:transparent; background:var(--teal); color:#fff; box-shadow:0 8px 16px -9px rgba(15,163,163,.7); }
.chip.spec.on{ background:var(--g-signal); color:#3d2600; }

/* tabs de modo */
.tabs{ margin-bottom:20px; }
.tab{ flex:none; min-width:74px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 10px;
 border:1.5px solid var(--line); background:rgba(255,255,255,.72); border-radius:15px; cursor:pointer; color:var(--muted);
 font-size:11.5px; font-weight:600; font-family:inherit; transition:.18s; }
.tab.on{ border-color:transparent; background:var(--card); color:var(--ink); box-shadow:0 10px 24px -14px rgba(20,32,59,.5); }
.tab.on .tabic{ background:var(--g-primary); color:#fff; }
.tabic{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:#eef1f7; color:var(--muted); transition:.18s; }

/* tarjeta */
.card{ position:relative; background:var(--card); border:1px solid rgba(223,227,238,.9); border-radius:24px; padding:24px 22px;
 box-shadow:0 24px 60px -34px rgba(20,32,59,.55), 0 2px 8px -4px rgba(20,32,59,.08); overflow:hidden; animation:rise .34s cubic-bezier(.2,.7,.3,1); }
.card:before{ content:''; position:absolute; left:0; right:0; top:0; height:3px; background:var(--g-wave); opacity:.85; }
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--teal-d);
 margin-bottom:16px; display:flex; align-items:center; gap:7px; }

.eq{ display:flex; align-items:center; justify-content:center; gap:5px; height:66px; margin:4px 0 18px; }
.eq b{ width:6px; border-radius:6px; background:linear-gradient(180deg,var(--teal),var(--amber)); opacity:.28; height:16px; display:block; transition:opacity .2s; }
.eq.playing b{ opacity:1; animation:bounce 1s ease-in-out infinite; }
.eq.playing b:nth-child(1){animation-delay:0s}.eq.playing b:nth-child(2){animation-delay:.12s}.eq.playing b:nth-child(3){animation-delay:.26s}.eq.playing b:nth-child(4){animation-delay:.4s}.eq.playing b:nth-child(5){animation-delay:.2s}.eq.playing b:nth-child(6){animation-delay:.32s}.eq.playing b:nth-child(7){animation-delay:.08s}.eq.playing b:nth-child(8){animation-delay:.24s}.eq.playing b:nth-child(9){animation-delay:.05s}
@keyframes bounce{0%,100%{height:16px}50%{height:54px}}

.en{ font-family:'Bricolage Grotesque',sans-serif; font-size:23px; font-weight:700; line-height:1.32; text-align:center; margin:2px 0; min-height:32px; letter-spacing:-.01em; }
.es{ color:var(--ink2); font-size:15px; text-align:center; margin-top:9px; line-height:1.4; }
.hidden{ color:var(--muted); font-size:14px; text-align:center; font-style:italic; }
.note{ display:flex; gap:9px; background:linear-gradient(180deg,#FFF7E9,#FFF1D8); border:1px solid #F6DCA6; color:#7a5a12;
 border-radius:14px; padding:11px 13px; font-size:13px; margin-top:15px; line-height:1.45; }
.note svg{ flex:none; margin-top:1px; }
.status{ display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; font-size:14px; font-weight:600; color:var(--ink2); min-height:22px; padding:0 6px; }
.status.repeat,.status.rec{ color:var(--coral); } .status.listen{ color:var(--teal-d); } .status.done{ color:var(--teal-d); }
.progress{ height:8px; background:#eceef4; border-radius:6px; overflow:hidden; margin-top:13px; }
.progress i{ display:block; height:100%; width:0; background:var(--g-signal); border-radius:6px; animation:fillbar linear forwards; }
@keyframes fillbar{ from{width:0} to{width:100%} }

.controls{ display:flex; gap:9px; margin-top:16px; }
.btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; border:1.5px solid var(--line);
 background:#fff; color:var(--ink); border-radius:14px; padding:13px 8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:.16s; }
.btn:hover{ border-color:#c4cad9; transform:translateY(-1px); } .btn:active{ transform:translateY(0); }
.btn.primary{ background:var(--g-primary); color:#fff; border-color:transparent; box-shadow:0 12px 24px -14px rgba(20,32,59,.6); }
.btn.signal{ background:var(--g-signal); color:#3d2600; border-color:transparent; box-shadow:0 12px 24px -14px rgba(240,135,62,.7); }
.btn.rec{ background:linear-gradient(135deg,#EF5D48,#e8452e); color:#fff; border-color:transparent; }
.btn.grow0{ flex:none; padding:11px 18px; }
.btn.saved{ border-color:var(--amber); color:#8a5a00; background:#FFF7E9; }
.btn.mini{ padding:10px 6px; font-size:13px; }
.speed{ display:flex; align-items:center; gap:11px; margin-top:16px; font-size:13px; color:var(--muted); }
.speed input{ flex:1; accent-color:var(--teal); } .speed b{ color:var(--ink); width:42px; text-align:right; font-variant-numeric:tabular-nums; }

.clz{ font-family:'Bricolage Grotesque',sans-serif; font-size:21px; font-weight:700; line-height:1.5; text-align:center; margin-bottom:20px; }
.blank{ background:linear-gradient(180deg,transparent 62%,rgba(245,165,36,.35) 0); color:var(--amber-d); font-weight:800; padding:0 8px; border-radius:3px; }
.opts{ display:grid; gap:10px; }
.opt{ text-align:left; border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:14px; padding:14px 16px;
 font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; transition:.13s; display:flex; align-items:center; justify-content:space-between; }
.opt:hover{ border-color:#c4cad9; transform:translateY(-1px); }
.opt.right{ border-color:var(--teal); background:#E7F7F6; color:#0a6b6b; }
.opt.wrong{ border-color:var(--coral); background:#FDECE9; color:#a5311f; } .opt.dim{ opacity:.48; }

.line{ display:flex; gap:10px; margin-bottom:11px; align-items:flex-start; } .line.b{ flex-direction:row-reverse; }
.av{ width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff; }
.av.a{ background:var(--g-primary); } .av.b{ background:linear-gradient(135deg,var(--teal),var(--teal-d)); }
.bubble{ max-width:80%; background:#f1f3f9; border-radius:16px; padding:11px 14px; cursor:pointer; border:1.5px solid transparent; transition:.13s; }
.line.b .bubble{ background:#E7F7F6; } .bubble:hover{ border-color:var(--line); transform:translateY(-1px); }
.bubble .bt{ font-size:15px; font-weight:600; line-height:1.38; } .bubble .bs{ font-size:13px; color:var(--muted); margin-top:5px; }
.talktitle{ font-family:'Bricolage Grotesque',sans-serif; font-size:19px; font-weight:700; margin-bottom:16px; }

.dictarea{ width:100%; min-height:76px; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; font-size:16px;
 font-family:inherit; color:var(--ink); resize:vertical; margin-top:4px; background:#fbfcfe; }
.dictarea:focus{ outline:none; border-color:var(--teal); }
.heard{ background:#f1f3f9; border-radius:14px; padding:12px 14px; font-size:14px; margin-top:15px; color:var(--ink2); line-height:1.45; }
.heard .lbl{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:5px; }
.marked{ font-size:18px; line-height:1.45; text-align:center; margin-top:8px; font-family:'Bricolage Grotesque',sans-serif; font-weight:600; }
.wm{ color:var(--teal-d); } .wx{ color:var(--coral); text-decoration:line-through; text-decoration-color:rgba(239,93,72,.5); }
.scorebar{ height:11px; background:#eceef4; border-radius:6px; overflow:hidden; margin-top:15px; }
.scorebar i{ display:block; height:100%; border-radius:6px; transition:width .5s cubic-bezier(.2,.7,.3,1); }
.scoretxt{ text-align:center; font-weight:700; font-size:15px; margin-top:11px; }
.rate3{ display:flex; gap:9px; margin-top:16px; }
.rate3 button{ flex:1; border-radius:13px; padding:12px 6px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; border:1.5px solid var(--line); background:#fff; transition:.15s; }
.rate3 .hard{ color:var(--coral); } .rate3 .ok{ color:var(--amber-d); } .rate3 .easy{ color:var(--teal-d); }
.rate3 button:hover{ transform:translateY(-1px); }
.poschip{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-d); background:#E7F7F6; border:1px solid #B6E4E1; border-radius:999px; padding:4px 11px; }
.vocword{ font-family:'Bricolage Grotesque',sans-serif; font-size:34px; font-weight:800; text-align:center; letter-spacing:-.02em; margin-top:6px; }
.meta{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:12px; color:var(--muted); } .meta b{ color:var(--ink); }
.err{ background:#FDECE9; border:1px solid #F5C4bb; color:#a5311f; border-radius:14px; padding:12px 14px; font-size:13px; margin-top:14px; line-height:1.45; }
.foot{ text-align:center; margin-top:24px; color:var(--muted); font-size:12px; line-height:1.7; }
svg{ display:inline-block; vertical-align:middle; }
@media (prefers-reduced-motion: reduce){ .eq.playing b{ animation:none !important; } .wavebar svg{ animation:none !important; } .card{ animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
 <div class="hero">
  <div class="herocard">
   <div class="wavebar"><svg viewBox="0 0 1200 120" preserveAspectRatio="none">
     <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#0FA3A3" stop-opacity=".55"/><stop offset="1" stop-color="#F5A524" stop-opacity=".55"/></linearGradient></defs>
     <path d="M0,70 C100,30 200,110 300,70 C400,30 500,110 600,70 C700,30 800,110 900,70 C1000,30 1100,110 1200,70" stroke="url(#wg)"/>
     <path d="M0,90 C100,55 200,125 300,90 C400,55 500,125 600,90 C700,55 800,125 900,90 C1000,55 1100,125 1200,90" stroke="url(#wg)" opacity=".5"/>
   </svg></div>
   <div class="brandrow">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></div>
    <div><div class="brandname">Sintoniza</div></div>
   </div>
   <div class="brandtag">Entrena tu oido para el ingles real: escucha, imita, habla y entiende peliculas, discursos y conversaciones.</div>
   <div class="hrow">
    <button class="test" id="testBtn">&#128266; Probar sonido</button>
    <span class="streak" id="streak"></span>
   </div>
  </div>
 </div>
 <div id="audioMsg"></div>
 <div class="levels" id="levels"></div>
 <div class="tlabel">Tema</div>
 <div class="topics rowscroll" id="topics"></div>
 <div class="tabs rowscroll" id="tabs"></div>
 <div id="cardArea"></div>
 <div class="foot" id="foot"></div>
</div>

<script>
var IC={
 play:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
 rew:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>',

};
IC.cards='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="16" rx="2"/><path d="M7 5V3h14v16h-2"/></svg>';
var tabIcon={ listen:IC.head, shadow:IC.mic, speak:IC.mic2, dictation:IC.pencil, cloze:IC.book, vocab:IC.cards, talk:IC.chat };

var LEVELS=[{id:'A2',label:'Basico +'},{id:'B1',label:'Intermedio'},{id:'B2',label:'Avanzado'}];
var MODES=[{id:'listen',label:'Escuchar'},{id:'shadow',label:'Imitar'},{id:'speak',label:'Hablar'},{id:'dictation',label:'Dictado'},{id:'cloze',label:'Palabras'},{id:'vocab',label:'Vocabulario'},{id:'talk',label:'Dialogo'}];

 {t:'convo',l:'B2',title:"Poniendose de acuerdo",lines:[
  {s:'A',en:"So, what do you think of the idea?",es:"Y bien, que te parece la idea?"},
  {s:'B',en:"To be honest, I'm not so sure.",es:"Para ser sincero, no estoy tan seguro."},

  {s:'A',en:"Good point. Let's rethink it.",es:"Buen punto. Repensemoslo."}]},
 {t:'travel',l:'B1',title:"Tomando un taxi",lines:[
  {s:'A',en:"Where to?",es:"A donde?"},
  {s:'B',en:"To the airport, please. Terminal two.",es:"Al aeropuerto, terminal dos."},

 {t:'health',l:'B1',title:"En la farmacia",lines:[
  {s:'A',en:"Hi, do you have something for a headache?",es:"Hola, tiene algo para el dolor de cabeza?"},

  {s:'A',en:"Since this morning.",es:"Desde esta manana."},
  {s:'B',en:"Take one of these every six hours.",es:"Tome una cada seis horas."},
  {s:'A',en:"Got it, thank you.",es:"Entendido, gracias."}]},
 {t:'food',l:'B1',title:"Reservando una mesa",lines:[
  {s:'A',en:"Hi, I'd like to book a table for two.",es:"Hola, quisiera reservar mesa para dos."},

  {s:'A',en:"That's fine. Thank you.",es:"Esta bien. Gracias."}]},
 {t:'meetings',l:'B2',title:"Dando feedback",lines:[

/* ============ voz ============ */
function loadVoices(){ voices=(window.speechSynthesis && speechSynthesis.getVoices())||[]; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(prefer){ if(!voices.length) return null;
 var en=voices.filter(function(v){return /en(-|_)?/i.test(v.lang);}); var pool=en.length?en:voices;
 if(prefer==='b') return pool.filter(function(v){return /female|woman|samantha|zira|karen/i.test(v.name);})[0] || pool[Math.min(1,pool.length-1)];
 return pool.filter(function(v){return /male|daniel|alex|david|google us/i.test(v.name);})[0] || pool[0]; }
function setSpeaking(on){ S.speaking=on; var eq=document.querySelector('.eq'); if(eq) eq.classList.toggle('playing',on); }
function setAudioMsg(m){ S.audioMsg=m; var el=document.getElementById('audioMsg'); el.innerHTML=m?('<div class="err" style="margin-top:12px">'+m+'</div>'):''; }
function speak(text,opts){ opts=opts||{}; var synth=window.speechSynthesis;
 if(!synth || typeof SpeechSynthesisUtterance==='undefined'){ setAudioMsg("Este navegador no permite reproducir voz. Prueba en Safari o Chrome actualizados."); return; }
 setAudioMsg(""); clearTimeout(speakTimer);
 try{ synth.resume(); if(synth.speaking||synth.pending) synth.cancel();
  var u=new SpeechSynthesisUtterance(text); var v=pickVoice(opts.voice);
  if(v){ u.voice=v; u.lang=v.lang; } else { u.lang='en-US'; }
  u.rate=(opts.rate!=null)?opts.rate:S.rate;
  u.onstart=function(){ setSpeaking(true); }; u.onend=function(){ setSpeaking(false); };
  u.onerror=function(){ setSpeaking(false); setAudioMsg("No pude reproducir el audio. Sube el volumen, quita el silencio y prueba de nuevo."); };
  setSpeaking(true); synth.speak(u);
  setTimeout(function(){ try{ synth.resume(); }catch(e){} },240);
  speakTimer=setTimeout(function(){ setSpeaking(false); }, 900+text.length*95);
 }catch(e){ setSpeaking(false); setAudioMsg("No pude reproducir el audio en este dispositivo."); } }
function speakDialogue(d){ var synth=window.speechSynthesis; if(!synth){ setAudioMsg("Este navegador no permite reproducir voz."); return; }
 synth.resume(); synth.cancel();
 d.lines.forEach(function(ln,i){ var u=new SpeechSynthesisUtterance(ln.en); var v=pickVoice(ln.s==='B'?'b':'a'); if(v){ u.voice=v; u.lang=v.lang; } u.rate=S.rate;
  if(i===0) u.onstart=function(){ setSpeaking(true); }; if(i===d.lines.length-1) u.onend=function(){ setSpeaking(false); }; synth.speak(u); }); }

/* ============ reconocimiento de voz ============ */
function stopRecog(){ try{ if(recog){ recog.onresult=recog.onerror=recog.onend=null; recog.abort(); } }catch(e){} recog=null; S.recording=false; }
function startRecog(target){ var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ setAudioMsg("Este navegador no reconoce tu voz. Usa el modo como repeticion: oye el modelo y repitelo."); return; }
 setAudioMsg(""); stopRecog();
 try{ recog=new SR(); recog.lang='en-US'; recog.interimResults=false; recog.maxAlternatives=1;
  S.recording=true; S.heard=''; render();
  recog.onresult=function(e){ var t=e.results[0][0].transcript; S.heard=t; S.recording=false;
   var c=current(); if(c){ srsUpdate(c,'sent', scorePct(c.en,t)>=75?2:(scorePct(c.en,t)>=50?1:0)); } markPractice(); render(); };
  recog.onerror=function(e){ S.recording=false; var msg="No pude escucharte. Intenta de nuevo.";
   if(e.error==='not-allowed'||e.error==='service-not-allowed') msg="Permiso de microfono denegado o no disponible. El modo Hablar necesita microfono; funciona mejor en Chrome (Android/PC) y con conexion.";
   else if(e.error==='no-speech') msg="No detecte tu voz. Acercate al microfono y prueba otra vez.";
   else if(e.error==='network') msg="El reconocimiento de voz necesita conexion a internet.";
   setAudioMsg(msg); render(); };
  recog.onend=function(){ if(S.recording){ S.recording=false; render(); } };
  recog.start();
 }catch(err){ S.recording=false; setAudioMsg("No pude iniciar el microfono en este dispositivo."); render(); } }
function norm(s){ return (s||'').toLowerCase().replace(/[^\w\s']/g,' ').split(/\s+/).filter(Boolean); }
function scorePct(target,heard){ var tw=norm(target); if(!tw.length) return 0; var hs={}; norm(heard).forEach(function(w){ hs[w]=1; });
 var m=0; tw.forEach(function(w){ if(hs[w]) m++; }); return Math.round(m/tw.length*100); }
function targetMarked(target,heard){ var hs={}; norm(heard).forEach(function(w){ hs[w]=1; });
 return target.split(/\s+/).map(function(tok){ var n=tok.toLowerCase().replace(/[^\w']/g,''); var ok=n&&hs[n]; return '<span class="'+(ok?'wm':'wx')+'">'+tok+'</span>'; }).join(' '); }

/* ============ guardados ============ */
function savedList(){ return LS.get('saved',[]); }
function isSaved(c){ var key=c.en||c.s; return savedList().some(function(x){ return (x.en||x.s)===key; }); }
function toggleSave(c,type){ var list=savedList(); var key=c.en||c.s; var i=-1;
 for(var j=0;j<list.length;j++){ if((list[j].en||list[j].s)===key){ i=j; break; } }
 if(i>=0){ list.splice(i,1); } else { var item=Object.assign({type:type},c); list.push(item); srsAddIfMissing(c,type,1); }
 LS.set('saved',list); if(S.topic==='_saved') buildQueues(); render(); }

/* ============ repaso espaciado (SRS) ============ */
function srsGet(){ return LS.get('srs',{}); }
function keyOf(c){ return c.en||c.s; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(d,n){ var dt=new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function srsUpdate(c,type,quality){ var o=srsGet(); var k=keyOf(c); var e=o[k]||{interval:0,reps:0};
 var iv; if(quality<=0) iv=1; else if(quality===1) iv=Math.max(2,Math.round((e.interval||1)*2)); else iv=Math.max(4,Math.round((e.interval||2)*3));
 iv=Math.min(iv,120); e.interval=iv; e.reps=(e.reps||0)+1; e.due=addDays(todayStr(),iv); e.type=type;
 e.item=Object.assign({type:type},c); o[k]=e; LS.set('srs',o); updateFoot(); }
function srsAddIfMissing(c,type,quality){ var o=srsGet(); if(!o[keyOf(c)]) srsUpdate(c,type,quality); }
function srsDue(){ var o=srsGet(); var t=todayStr(); var out=[]; Object.keys(o).forEach(function(k){ if((o[k].due||t)<=t && o[k].item) out.push(o[k].item); }); return out; }

/* ============ racha ============ */
function markPractice(){ var st=LS.get('streak',{last:null,streak:0,total:0}); var today=todayStr();
 if(st.last!==today){ var y=addDays(today,-1); st.streak=(st.last===y)?(st.streak+1):1; st.last=today; }
 st.total=(st.total||0)+1; LS.set('streak',st); updateStreak(); updateFoot(); }
function updateStreak(){ var st=LS.get('streak',{streak:0,total:0}); var el=document.getElementById('streak');
 if(el) el.innerHTML='&#128293; '+(st.streak||0)+' '+((st.streak===1)?'dia':'dias'); }
function updateFoot(){ var st=LS.get('streak',{total:0}); var sv=savedList().length; var due=srsDue().length;
 document.getElementById('foot').innerHTML='Practicadas: <b style="color:var(--ink)">'+(st.total||0)+'</b> &middot; Guardadas: <b style="color:var(--ink)">'+sv+'</b> &middot; Para repasar: <b style="color:var(--ink)">'+due+'</b><br>Funciona sin conexion &middot; 15 min al dia rinde mas que una hora pasiva'; }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function poolFor(mode){
 function byType(arr){ if(mode==='cloze') return arr.filter(function(x){return x.type==='cloze';}); if(mode==='vocab') return arr.filter(function(x){return x.type==='vocab';}); if(mode==='talk') return []; return arr.filter(function(x){return x.type==='sent';}); }
 if(S.topic==='_review'){ return byType(srsDue()); }
 if(S.topic==='_saved'){ return byType(savedList()); }
 var src=(mode==='cloze')?CLOZE:(mode==='talk')?TALK:(mode==='vocab')?VOCAB:SENT;
 var byLevel=src.filter(function(x){return x.l===S.level;}); var base=byLevel.length?byLevel:src;
 if(S.topic!=='any' && mode!=='vocab'){ var f=base.filter(function(x){return x.t===S.topic;}); if(!f.length) f=src.filter(function(x){return x.t===S.topic;}); if(f.length) base=f; }
 return base; }
function buildQueues(){ ['listen','shadow','speak','dictation','cloze','vocab','talk'].forEach(function(m){ S.queues[m]=shuffle(poolFor(m)); }); }
function current(){ var q=S.queues[S.mode]; return (q&&q.length)?q[0]:null; }
function clearShadow(){ shadowTimers.forEach(clearTimeout); shadowTimers=[]; }
function resetCard(){ S.showEn=false; S.showEs=false; S.showNote=false; S.picked=null; S.talkReveal=false; S.shadowPhase='ready'; S.heard=''; S.typed=''; S.checked=false; clearShadow(); stopRecog(); if(window.speechSynthesis) speechSynthesis.cancel(); setSpeaking(false); }
function next(){ S.count++; markPractice(); resetCard(); var q=S.queues[S.mode]; if(q&&q.length){ q.push(q.shift()); if(q.length && Math.random()<0.15) S.queues[S.mode]=shuffle(q); } render(); }
function reviewRate(quality){ var c=current(); if(c){ srsUpdate(c,(S.mode==='cloze')?'cloze':(S.mode==='vocab')?'vocab':'sent',quality); } next(); }
function startShadow(){ var c=current(); if(!c) return; clearShadow(); if(window.speechSynthesis) speechSynthesis.cancel(); S.shadowPhase='listen'; render(); speak(c.en,{rate:S.rate});
 var listenMs=(650+c.en.length*75)/S.rate, repeatMs=listenMs*1.5+600;
 shadowTimers.push(setTimeout(function(){ S.shadowPhase='repeat'; render(); }, listenMs+250));

 el('levels').innerHTML=LEVELS.map(function(l){return '<button class="lvl'+(S.level===l.id?' on':'')+'" data-lvl="'+l.id+'">'+l.label+'</button>';}).join('');
 el('topics').innerHTML=TOPICS.map(function(t){var sp=t.spec?' spec':''; return '<button class="chip'+sp+(S.topic===t.id?' on':'')+'" data-topic="'+t.id+'">'+t.label+'</button>';}).join('');
 el('tabs').innerHTML=MODES.map(function(m){return '<button class="tab'+(S.mode===m.id?' on':'')+'" data-mode="'+m.id+'"><span class="tabic">'+tabIcon[m.id]+'</span>'+m.label+'</button>';}).join('');
 el('levels').querySelectorAll('[data-lvl]').forEach(function(b){ b.onclick=function(){ S.level=b.dataset.lvl; LS.set('level',S.level); buildQueues(); resetCard(); chrome(); render(); }; });
 el('topics').querySelectorAll('[data-topic]').forEach(function(b){ b.onclick=function(){ S.topic=b.dataset.topic; LS.set('topic',S.topic); buildQueues(); resetCard(); chrome(); render(); }; });
 el('tabs').querySelectorAll('[data-mode]').forEach(function(b){ b.onclick=function(){ S.mode=b.dataset.mode; buildQueues(); resetCard(); chrome(); render(); }; });
}
function eqHtml(){ return '<div class="eq'+(S.speaking?' playing':'')+'">'+Array.apply(null,{length:9}).map(function(){return '<b></b>';}).join('')+'</div>'; }
function speedHtml(){ return '<div class="speed"><span>Velocidad</span><input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="'+S.rate+'"><b>'+S.rate.toFixed(2)+'x</b></div>'; }
function saveBtn(c,type){ var on=isSaved(c); return '<button class="btn mini'+(on?' saved':'')+'" id="saveBtn">'+(on?IC.star:IC.starO)+' '+(on?'Guardada':'Guardar')+'</button>'; }
function wireSave(c,type){ var b=el('saveBtn'); if(b) b.onclick=function(){ toggleSave(c,type); }; }
function reviewRow(){ if(S.topic!=='_review') return ''; return '<div class="rate3"><button class="hard" data-q="0">Dificil</button><button class="ok" data-q="1">Bien</button><button class="easy" data-q="2">Facil</button></div>'; }
function wireReview(){ if(S.topic!=='_review') return; document.querySelectorAll('.rate3 [data-q]').forEach(function(b){ b.onclick=function(){ reviewRate(parseInt(b.dataset.q,10)); }; }); }
function metaNext(label,hideNext){ return '<div class="meta"><span>En esta sesion: <b>'+S.count+'</b></span>'+(hideNext?'':'<button class="btn primary grow0" id="nextBtn">'+(label||'Siguiente')+' '+IC.arrow+'</button>')+'</div>'; }

function render(){ var area=el('cardArea'); var c=current();
 if(!c){ var msg='No hay contenido para este filtro.';
  if(S.topic==='_review') msg='No tienes nada para repasar hoy. Completa ejercicios o guarda frases y volveran aqui cuando toque repasarlas.';
  else if(S.topic==='_saved') msg='Aun no has guardado nada. Toca &#9733; Guardar en una tarjeta para repasarla luego.';
  else if(S.mode==='talk' && (S.topic==='_review'||S.topic==='_saved')) msg='Los dialogos no se guardan aqui. Cambia de modo para ver tus tarjetas.';
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.bulb+' Nada por ahora</div><div class="hidden">'+msg+'</div></div>'; updateFoot(); return; }

 if(S.mode==='listen'){
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.head+' Escucha activa</div>'+eqHtml()
   +(S.showEn?'<div class="en">'+c.en+'</div>':'<div class="en hidden">Escucha y trata de entender...</div>')
   +(S.showEs?'<div class="es">'+c.es+'</div>':'')
   +((S.showNote&&c.note)?'<div class="note">'+IC.bulb+'<span>'+c.note+'</span></div>':'')
   +speedHtml()
   +'<div class="controls"><button class="btn signal" id="hear">'+IC.play+' Escuchar</button><button class="btn" id="slow">'+IC.rew+' Lento</button></div>'
   +'<div class="controls"><button class="btn mini" id="tEn">'+(S.showEn?IC.eyeoff+' Ocultar':IC.eye+' Texto')+'</button><button class="btn mini" id="tEs">'+IC.lang+' '+(S.showEs?'Ocultar':'Traducir')+'</button>'+(c.note?'<button class="btn mini" id="tNote">'+IC.bulb+' Tip</button>':'')+saveBtn(c,'sent')+'</div>'
   +reviewRow()+metaNext('Siguiente', S.topic==='_review')+'</div>';
  el('hear').onclick=function(){ speak(c.en); }; el('slow').onclick=function(){ speak(c.en,{rate:0.55}); };
  el('tEn').onclick=function(){ S.showEn=!S.showEn; render(); }; el('tEs').onclick=function(){ S.showEs=!S.showEs; render(); };
  if(el('tNote')) el('tNote').onclick=function(){ S.showNote=!S.showNote; render(); }; wireSave(c,'sent'); wireReview();
 }
 else if(S.mode==='shadow'){
  var listenMs=(650+c.en.length*75)/S.rate, repeatMs=listenMs*1.5+600;
  var status={ready:"Pulsa Empezar: escucha y luego repite en voz alta",listen:"Escucha con atencion...",repeat:"Tu turno! Repite imitando el ritmo",done:"Bien! Escuchate de nuevo y compara"}[S.shadowPhase];
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.mic+' Shadowing &middot; imita el ritmo</div>'+eqHtml()
   +'<div class="status '+S.shadowPhase+'">'+(S.shadowPhase==='repeat'?IC.mic:(S.shadowPhase==='listen'?IC.ear:''))+'<span>'+status+'</span></div>'
   +((S.shadowPhase==='repeat')?'<div class="progress"><i style="animation-duration:'+repeatMs+'ms"></i></div>':'')
   +((S.showEn||S.shadowPhase==='done')?'<div class="en" style="margin-top:14px">'+c.en+'</div>':'<div class="en hidden" style="margin-top:14px">El texto aparece al terminar...</div>')
   +(S.showEs?'<div class="es">'+c.es+'</div>':'')
   +((S.showNote&&c.note)?'<div class="note">'+IC.bulb+'<span>'+c.note+'</span></div>':'')
   +speedHtml()
   +'<div class="controls">'+((S.shadowPhase==='ready'||S.shadowPhase==='done')?'<button class="btn signal" id="startSh">'+IC.play+' '+(S.shadowPhase==='done'?'Otra vez':'Empezar')+'</button>':'<button class="btn signal" id="again">'+IC.rot+' Oir de nuevo</button>')+'<button class="btn" id="slow">'+IC.rew+' Lento</button></div>'
   +'<div class="controls"><button class="btn mini" id="tEn">'+(S.showEn?IC.eyeoff+' Ocultar':IC.eye+' Texto')+'</button><button class="btn mini" id="tEs">'+IC.lang+' '+(S.showEs?'Ocultar':'Traducir')+'</button>'+saveBtn(c,'sent')+'</div>'
   +reviewRow()+metaNext('Siguiente', S.topic==='_review')+'</div>';
  if(el('startSh')) el('startSh').onclick=startShadow; if(el('again')) el('again').onclick=function(){ speak(c.en,{rate:S.rate}); };
  el('slow').onclick=function(){ speak(c.en,{rate:0.55}); }; el('tEn').onclick=function(){ S.showEn=!S.showEn; render(); }; el('tEs').onclick=function(){ S.showEs=!S.showEs; render(); };
  wireSave(c,'sent'); wireReview();
 }
 else if(S.mode==='speak'){
  var supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  var pct=S.heard?scorePct(c.en,S.heard):null;
  var fb=(pct==null)?'':(pct>=85?'Excelente! Muy claro.':(pct>=60?'Bien! Ya casi. Repitelo una vez mas.':'Sigue practicando: escucha el modelo y vuelve a intentar.'));
  var col=(pct==null)?'':(pct>=85?'var(--teal)':(pct>=60?'var(--amber)':'var(--coral)'));
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.mic+' Habla y compara</div>'
   +'<div class="en">'+c.en+'</div>'+(S.showEs?'<div class="es">'+c.es+'</div>':'')
   +(!supported?'<div class="note">'+IC.bulb+'<span>Este navegador no reconoce tu voz. Usa el modo como repeticion guiada: oye el modelo y repitelo en voz alta. El microfono funciona mejor en Chrome (Android/PC) y con conexion.</span></div>':'')
   +(S.recording?'<div class="status rec">'+IC.mic+'<span>Escuchando... di la frase ahora</span></div>':'')
   +(S.heard?('<div class="heard"><span class="lbl">Escuche</span>'+S.heard+'</div><div class="marked">'+targetMarked(c.en,S.heard)+'</div><div class="scorebar"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="scoretxt" style="color:'+col+'">'+pct+'% &middot; '+fb+'</div>'):'')
   +'<div class="controls">'+(supported?'<button class="btn '+(S.recording?'rec':'signal')+'" id="rec">'+IC.mic2+' '+(S.recording?'Escuchando...':(S.heard?'Intentar de nuevo':'Hablar'))+'</button>':'')+'<button class="btn'+(supported?'':' signal')+'" id="model">'+IC.vol+' Oir modelo</button></div>'
   +'<div class="controls"><button class="btn mini" id="slow">'+IC.rew+' Lento</button><button class="btn mini" id="tEs">'+IC.lang+' '+(S.showEs?'Ocultar':'Traducir')+'</button>'+saveBtn(c,'sent')+'</div>'
   +metaNext('Siguiente', false)+'</div>';
  if(el('rec')) el('rec').onclick=function(){ if(S.recording){ stopRecog(); render(); } else { startRecog(c.en); } };
  el('model').onclick=function(){ speak(c.en); }; el('slow').onclick=function(){ speak(c.en,{rate:0.55}); };
  el('tEs').onclick=function(){ S.showEs=!S.showEs; render(); }; wireSave(c,'sent');
 }
 else if(S.mode==='dictation'){
  var pctd=S.checked?scorePct(c.en,S.typed):null;
  var cold=(pctd==null)?'':(pctd>=85?'var(--teal)':(pctd>=60?'var(--amber)':'var(--coral)'));
  var fbd=(pctd==null)?'':(pctd>=85?'Casi perfecto!':(pctd>=60?'Bien, revisa lo tachado.':'Vuelve a escuchar con calma.'));
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.pencil+' Dictado &middot; escucha y escribe</div>'+eqHtml()
   +'<div class="controls" style="margin-top:0"><button class="btn signal" id="hearD">'+IC.play+' Escuchar</button><button class="btn" id="slowD">'+IC.rew+' Lento</button></div>'
   +'<textarea class="dictarea" id="typed" placeholder="Escribe lo que escuchaste..." '+(S.checked?'disabled':'')+'>'+(S.typed||'')+'</textarea>'
   +(S.checked?('<div class="marked">'+targetMarked(c.en,S.typed)+'</div><div class="es" style="margin-top:10px">'+c.es+'</div><div class="scorebar"><i style="width:'+pctd+'%;background:'+cold+'"></i></div><div class="scoretxt" style="color:'+cold+'">'+pctd+'% &middot; '+fbd+'</div>'):'')
   +'<div class="controls">'+(S.checked?('<button class="btn" id="hearD2">'+IC.vol+' Oir modelo</button>'+saveBtn(c,'sent')):('<button class="btn primary" id="checkD">'+IC.check+' Comprobar</button>'))+'</div>'
   +metaNext('Siguiente', false)+'</div>';
  el('hearD').onclick=function(){ speak(c.en); }; el('slowD').onclick=function(){ speak(c.en,{rate:0.55}); };
  var ta=el('typed'); if(ta){ ta.oninput=function(){ S.typed=ta.value; }; }
  if(el('checkD')) el('checkD').onclick=function(){ if(ta) S.typed=ta.value; S.checked=true; var q=scorePct(c.en,S.typed); srsUpdate(c,'sent', q>=75?2:(q>=50?1:0)); markPractice(); render(); };
  if(el('hearD2')) el('hearD2').onclick=function(){ speak(c.en); };
  wireSave(c,'sent');
 }
 else if(S.mode==='vocab'){
  var pos=c.pos?('<span class="poschip">'+c.pos+'</span>'):'';
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.cards+' Vocabulario &middot; frecuencia</div>'
   +'<div class="vocword">'+c.en+'</div><div style="text-align:center;margin-top:8px">'+pos+'</div>'
   +(S.showEs?'<div class="es" style="font-size:19px;margin-top:16px;color:var(--ink);font-weight:600">'+c.es+'</div>':'<div class="hidden" style="margin-top:16px">Toca Ver traduccion cuando la sepas</div>')
   +'<div class="controls"><button class="btn signal" id="hearV">'+IC.vol+' Escuchar</button><button class="btn" id="tEs">'+IC.lang+' '+(S.showEs?'Ocultar':'Ver traduccion')+'</button></div>'
   +(S.showEs?('<div class="rate3"><button class="hard" data-q="0">Dificil</button><button class="ok" data-q="1">Bien</button><button class="easy" data-q="2">Facil</button></div>'+'<div class="controls">'+saveBtn(c,'vocab')+'</div>'):'')
   +'<div class="meta"><span>En esta sesion: <b>'+S.count+'</b></span>'+(S.showEs?'':'<button class="btn primary grow0" id="nextBtn">Saltar '+IC.arrow+'</button>')+'</div></div>';
  el('hearV').onclick=function(){ speak(c.en); }; el('tEs').onclick=function(){ S.showEs=!S.showEs; render(); };
  document.querySelectorAll('.rate3 [data-q]').forEach(function(b){ b.onclick=function(){ reviewRate(parseInt(b.dataset.q,10)); }; });
  wireSave(c,'vocab');
 }
 else if(S.mode==='cloze'){
  var parts=c.s.split('___'); var answered=(S.picked!=null); var filled=c.s.replace('___',c.a); var opts='';
  c.o.forEach(function(op){ var cls='opt'; var ic=''; if(answered){ if(op===c.a){ cls+=' right'; ic=IC.check; } else if(op===S.picked){ cls+=' wrong'; ic=IC.x; } else cls+=' dim'; }
   opts+='<button class="'+cls+'" data-op="'+op.replace(/"/g,'&quot;')+'"'+(answered?' disabled':'')+'>'+op+ic+'</button>'; });
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.book+' Vocabulario en contexto</div>'
   +'<div class="clz">'+parts[0]+'<span class="blank">'+(answered?c.a:'?')+'</span>'+(parts[1]||'')+'</div>'
   +'<div class="opts">'+opts+'</div>'
   +(answered?('<div class="note" style="background:linear-gradient(180deg,#E7F7F6,#dff2f1);border-color:#B6E4E1;color:#0a6b6b">'+IC.lang+'<span>'+c.es+'</span></div><div class="controls"><button class="btn signal" id="hearC">'+IC.vol+' Oir la frase</button>'+saveBtn(c,'cloze')+'</div>'+reviewRow()+(S.topic==='_review'?'':'<div class="controls"><button class="btn primary" id="nextBtn">Siguiente '+IC.arrow+'</button></div>')):'')
   +'<div class="meta"><span>En esta sesion: <b>'+S.count+'</b></span>'+(answered?'':'<span>Elige la opcion correcta</span>')+'</div></div>';
  area.querySelectorAll('[data-op]').forEach(function(b){ b.onclick=function(){ S.picked=b.dataset.op; srsUpdate(c,'cloze', (b.dataset.op===c.a)?2:0); markPractice(); render(); }; });
  if(el('hearC')) el('hearC').onclick=function(){ speak(filled); }; wireSave(c,'cloze'); wireReview();
 }
 else if(S.mode==='talk'){
  var lines='';
  c.lines.forEach(function(ln){ var isB=(ln.s==='B'); lines+='<div class="line'+(isB?' b':'')+'"><div class="av '+(isB?'b':'a')+'">'+ln.s+'</div><div class="bubble" data-en="'+ln.en.replace(/"/g,'&quot;')+'" data-v="'+(isB?'b':'a')+'"><div class="bt">'+ln.en+' '+IC.vol+'</div>'+(S.talkReveal?'<div class="bs">'+ln.es+'</div>':'')+'</div></div>'; });
  area.innerHTML='<div class="card"><div class="eyebrow">'+IC.chat+' Conversacion cotidiana</div><div class="talktitle">'+c.title+'</div>'+lines
   +'<div class="controls"><button class="btn signal" id="playAll">'+IC.play+' Reproducir todo</button><button class="btn" id="tAll">'+IC.lang+' Traducir</button></div>'
   +'<div class="meta"><span>Toca cada burbuja para oirla</span><button class="btn primary grow0" id="nextBtn">Otra '+IC.arrow+'</button></div></div>';
  area.querySelectorAll('.bubble').forEach(function(b){ b.onclick=function(){ speak(b.dataset.en,{voice:b.dataset.v}); }; });
  el('playAll').onclick=function(){ speakDialogue(c); }; el('tAll').onclick=function(){ S.talkReveal=!S.talkReveal; render(); };
 }
 if(el('nextBtn')) el('nextBtn').onclick=next;
 var r=el('rate'); if(r) r.oninput=function(){ S.rate=parseFloat(r.value); LS.set('rate',S.rate); var b=r.nextElementSibling; if(b) b.textContent=S.rate.toFixed(2)+'x'; };
 updateFoot();
}

/* ============ init ============ */
document.getElementById('testBtn').onclick=function(){ speak("Hi! This is a sound test. Can you hear me?",{rate:0.95}); };
buildQueues(); chrome(); updateStreak(); render();
</script>
</body>
</html>
